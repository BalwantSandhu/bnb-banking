<a href="#main-content" class="skip-link">Skip to main content</a>

<header class="app-header">
  <div class="app-header-inner">
    <a routerLink="/dashboard" class="brand" (click)="closeMobileMenu()">
      <img src="images/bnb-logo.png" alt="BNB - Bank of New Brunswick logo" class="brand-logo" />
    </a>

    <button
      type="button"
      class="menu-toggle"
      (click)="toggleMobileMenu()"
      [attr.aria-expanded]="mobileMenuOpen()"
      aria-controls="main-nav"
      aria-label="Toggle navigation menu">
      <span class="hamburger-line"></span>
      <span class="hamburger-line"></span>
      <span class="hamburger-line"></span>
    </button>

    <nav class="main-nav" id="main-nav" aria-label="Main navigation" [class.main-nav--open]="mobileMenuOpen()">
      <a routerLink="/dashboard" routerLinkActive="active-link" [routerLinkActiveOptions]="{exact: true}" #rla1="routerLinkActive" [attr.aria-current]="rla1.isActive ? 'page' : null" (click)="closeMobileMenu()">Dashboard</a>
      <a routerLink="/accounts/create" routerLinkActive="active-link" #rla2="routerLinkActive" [attr.aria-current]="rla2.isActive ? 'page' : null" (click)="closeMobileMenu()">Create Account</a>
      <a routerLink="/transactions/transfer" routerLinkActive="active-link" #rla3="routerLinkActive" [attr.aria-current]="rla3.isActive ? 'page' : null" (click)="closeMobileMenu()">Transfer Funds</a>
      <a routerLink="/transactions/history" routerLinkActive="active-link" #rla4="routerLinkActive" [attr.aria-current]="rla4.isActive ? 'page' : null" (click)="closeMobileMenu()">Transaction History</a>
    </nav>
  </div>
</header>

<main class="app-content" id="main-content">
  <router-outlet></router-outlet>
</main>

<footer class="app-footer">
  <p>© 2026 BNB — Bank of New Brunswick. All rights reserved.</p>
  <p class="footer-sub">Take-Home Assessment — Banking Application</p>
</footer>
